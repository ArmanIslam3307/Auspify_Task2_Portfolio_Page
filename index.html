<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auspify Task-2 Portfolio</title>
    <link rel="stylesheet" href="./dist/style.css">
</head>

<body class="font-body text-ink antialiased">

    <!-- Header Section -->
    <header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur border-b border-line">
        <div class="max-w-6xl mx-auto px-5 sm:px-8">
            <div class="h-16 flex items-center justify-between">
                <a href="#home" class="flex items-center gap-2 font-display font-bold text-ink">
                    <span class="w-2.5 h-2.5 rounded-full bg-client"></span>
                    Arman<span class="text-muted font-normal">.dev</span>
                </a>

                <nav class="hidden md:flex items-center gap-8 font-mono text-[13px] text-muted">
                    <a href="#home" class="tab-underline pb-5 -mb-5">HOME</a>
                    <a href="#about" class="tab-underline hover:text-ink transition-colors pb-5 -mb-5">ABOUT</a>
                    <a href="#skills" class="tab-underline hover:text-ink transition-colors pb-5 -mb-5">STACK</a>
                    <a href="#projects" class="tab-underline hover:text-ink transition-colors pb-5 -mb-5">PROJECTS</a>
                    <a href="#contact" class="tab-underline hover:text-ink transition-colors pb-5 -mb-5">CONTACT</a>
                </nav>

                <a href="#contact"
                    class="hidden md:inline-flex items-center gap-2 font-mono text-[13px] bg-ink text-white px-4 py-2 rounded-lg hover:bg-client transition-colors">
                    Let's talk
                </a>

                <button id="menu-btn" aria-label="Toggle menu" aria-expanded="false" class="md:hidden text-ink">
                    <svg id="icon-open" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
                    </svg>
                    <svg id="icon-close" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="mobile-menu" class="md:hidden hidden border-t border-line bg-surface">
            <nav class="flex flex-col font-mono text-[13px] text-muted">
                <a href="#home" class="px-6 py-4 border-b border-line hover:text-ink">HOME</a>
                <a href="#about" class="px-6 py-4 border-b border-line hover:text-ink">ABOUT</a>
                <a href="#skills" class="px-6 py-4 border-b border-line hover:text-ink">STACK</a>
                <a href="#projects" class="px-6 py-4 border-b border-line hover:text-ink">PROJECTS/</a>
                <a href="#contact" class="px-6 py-4 hover:text-ink">CONTACT</a>
            </nav>
        </div>
    </header>



    <script src="./dist/script.js"></script>

</body>

</html>
